<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Soy de IES</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f5f5;
    }

    .contenedor {
        text-align: center;
        background: white;
        padding: 50px 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
        max-width: 500px;
        width: 90%;
    }

    .logo {
        width: 280px;
        max-width: 100%;
        height: auto;
        margin-bottom: 30px;
    }

    h1 {
        font-size: 3rem;
        color: #222;
        margin-bottom: 25px;
    }

    .boton {
        display: inline-block;
        padding: 14px 30px;
        background: #e30613;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: bold;
        transition: transform 0.2s, background 0.2s;
    }

    .boton:hover {
        background: #b8050f;
        transform: translateY(-2px);
    }

    @media (max-width: 480px) {
        .contenedor {
            padding: 35px 20px;
        }

        h1 {
            font-size: 2.3rem;
        }
    }
</style>

</head> <body>
<main class="contenedor">
    <img
        class="logo"
        src="https://ies21.edu.ar/wp-content/uploads/2025/11/LOGO_IES21.png"
        alt="Logo IES 21"
    >

    <h1>Soy de IES</h1>

    <a
        class="boton"
        href="https://ies21.edu.ar/"
        target="_blank"
        rel="noopener noreferrer"
    >
        Ir a IES 21
    </a>
</main>

</body> </html>
